name: Soul Licence Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soul-licence-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  soul-licence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # No `cache: 'pip'`: the checker is stdlib-only, and many repos
          # carrying this workflow have no requirements.txt, which makes
          # setup-python fail when caching is enabled.

      - name: SOUL LICENCE ONLY gate
        run: python tools/soul_licence_check.py
