name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then python -m pip install -r requirements-test.txt; fi
          if [ -f pyproject.toml ]; then
            # The declared floor may be newer than the newest interpreter a hosted
            # runner can install (several of these projects target free-threaded
            # builds). Ignoring the floor here tests the code on the runner; it does
            # not change the supported-version claim in pyproject.toml.
            python -m pip install --ignore-requires-python -e ".[test]" \
              || python -m pip install --ignore-requires-python -e . \
              || echo "::warning::editable install failed; tests will run against the source tree"
          fi

      - name: Run tests
        run: |
          if [ -d tests ]; then python -m pytest tests/ -v --tb=short; fi
