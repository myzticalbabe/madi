name: Deploy Domain Trees to GitHub Pages
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install networkx matplotlib pandas pygraphviz
          # Try to install graphify if available
          pip install graphify 2>/dev/null || echo "graphify not on PyPI, using local"

      - name: Generate domain atlases
        run: |
          # Clone the monorepo for domain_trees.py and render_tree.py
          git clone --depth 1 https://github.com/myzticalbabe/azazael.git ../azazael-mono
          cd ../azazael-mono
          python azazael/tools/domain_trees.py --domain sentinel 2>&1 | tail -20
          python azazael/tools/domain_trees.py 2>&1 | tail -30
          # Copy outputs
          mkdir -p ../pages-output/yggdrasil_forest
          cp -r ~/yggdrasil_forest/* ../pages-output/yggdrasil_forest/ 2>/dev/null || true

      - name: Generate HTML visualizations
        run: |
          cd ../azazael-mono
          # Create interactive index.html
          cp "$GITHUB_WORKSPACE/.github/pages/index.html" ../pages-output/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ../pages-output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4