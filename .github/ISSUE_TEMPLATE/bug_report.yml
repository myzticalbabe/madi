name: Bug Report
description: Report a bug or unexpected behavior
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I am using the latest release or main branch
          required: true

  - type: input
    id: version
    attributes:
      label: Version / Commit
      placeholder: "e.g., v1.0.0 or main@abc1234"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      placeholder: "What happened? What did you expect?"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (crash, data loss, security)
        - High (major feature broken)
        - Medium (minor feature broken, workaround exists)
        - Low (cosmetic, minor inconvenience)
      default: 2
    validations:
      required: true
