name: Feature Request
description: Suggest a new feature or enhancement
title: "[FEATURE] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      placeholder: "Describe the feature you'd like to see"
    validations:
      required: true

  - type: textarea
    id: usecase
    attributes:
      label: Use Case
      placeholder: "Why is this needed? What problem does it solve?"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High (critical for workflow)
        - Medium (nice to have)
        - Low (future consideration)
      default: 1
    validations:
      required: true
