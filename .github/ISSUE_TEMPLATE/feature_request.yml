name: Feature request
description: Suggest a capability, an improvement or an exercise
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. The most useful requests describe the problem, not
        only the solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you are in, and what makes it hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried instead?
      description: Workarounds, other tools, and why they were not enough.
  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      options:
        - Documentation or exercises
        - Command line behaviour
        - Library or API
        - Packaging and installation
        - Accessibility
        - Something else
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues for the same request
          required: true
